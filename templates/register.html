<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Register - Speech2Text</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

.password-container {

    position: relative;

    width: 100%;

}


.password-container .login-input {

    width: 100%;

    box-sizing: border-box;

    padding-right: 50px;

}


.show-password {

    position: absolute;

    right: 15px;

    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #555;

    font-size: 18px;

    cursor: pointer;

    padding: 5px;

}


.show-password:hover {

    color: #38bdf8;

}

</style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navbar">

    <div class="logo">

        <i class="fas fa-microphone-alt"></i>

        Speech2Text

    </div>

</nav>


<!-- =====================================================
     REGISTER PAGE
===================================================== -->

<section class="login-page">


    <div class="login-card">


        <div class="login-icon">

            <i class="fas fa-user-plus"></i>

        </div>


        <h1>

            Register

        </h1>


        <p class="login-subtitle">

            Create your Speech2Text account

        </p>


        {% if error %}

        <div class="login-message">

            {{ error }}

        </div>

        {% endif %}


        <form
            action="/register"
            method="POST"
        >


            <!-- =================================================
                 NAME
            ================================================= -->

            <div class="login-group">

                <label for="name">

                    <i class="fas fa-user"></i>

                    Name

                </label>


                <input
                    type="text"
                    id="name"
                    name="name"
                    class="login-input"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- =================================================
                 EMAIL
            ================================================= -->

            <div class="login-group">

                <label for="email">

                    <i class="fas fa-envelope"></i>

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    class="login-input"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- =================================================
                 PASSWORD
            ================================================= -->

            <div class="login-group">

                <label for="password">

                    <i class="fas fa-lock"></i>

                    Password

                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="login-input"
                        placeholder="Create a password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="show-password"
                        aria-label="Show password"
                    >

                        <i class="fas fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- =================================================
                 REGISTER BUTTON
            ================================================= -->

            <button
                type="submit"
                class="login-button"
            >

                <i class="fas fa-user-plus"></i>

                Register

            </button>


        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================= -->

        <div class="login-footer">

            <p>

                Already have an account?

                <a href="/login">

                    Login

                </a>

            </p>

        </div>


    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>

        © 2026 Speech To Text Converter |
        Flask Mini Project

    </p>

</footer>


<!-- =====================================================
     SHOW / HIDE PASSWORD JAVASCRIPT
===================================================== -->

<script>

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


togglePassword.addEventListener(
    "click",
    function () {


        if (
            password.type === "password"
        ) {


            // Show password

            password.type = "text";


            togglePassword.innerHTML =
                '<i class="fas fa-eye-slash"></i>';


            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );


        }

        else {


            // Hide password

            password.type = "password";


            togglePassword.innerHTML =
                '<i class="fas fa-eye"></i>';


            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);

</script>


</body>

</html>
