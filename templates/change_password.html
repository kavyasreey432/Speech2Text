<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Change Password - Speech2Text</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.password-page {

    width: 90%;

    max-width: 700px;

    margin: 70px auto;

}


.password-card {

    background: rgba(255,255,255,0.12);

    border-radius: 25px;

    padding: 40px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

}


.password-card h1 {

    text-align: center;

    color: white;

    margin-bottom: 35px;

}


.password-group {

    margin-bottom: 22px;

}


.password-group label {

    display: block;

    color: white;

    font-weight: 600;

    margin-bottom: 10px;

}


.password-group input {

    width: 100%;

    box-sizing: border-box;

    padding: 15px;

    border: none;

    border-radius: 14px;

    font-size: 16px;

    outline: none;

}


.password-buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 30px;

    flex-wrap: wrap;

}


.password-button {

    border: none;

    padding: 14px 25px;

    border-radius: 25px;

    color: white;

    background: #38bdf8;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    text-decoration: none;

}


.password-button:hover {

    background: #0284c7;

}


.cancel-password {

    background: #64748b;

}


.cancel-password:hover {

    background: #475569;

}


.error-message {

    padding: 12px;

    margin-bottom: 20px;

    border-radius: 10px;

    background: #fee2e2;

    color: #991b1b;

    text-align: center;

}

</style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <i class="fas fa-microphone-alt"></i>

        Speech2Text

    </div>

    <ul>

        <li>
            <a href="/profile">
                <i class="fas fa-user"></i>
                Profile
            </a>
        </li>

        <li>
            <a href="/logout">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </li>

    </ul>

</nav>


<section class="password-page">

<div class="password-card">

<h1>

    <i class="fas fa-lock"></i>

    Change Password

</h1>


{% if error %}

<div class="error-message">

    {{ error }}

</div>

{% endif %}


<form
    action="/change-password"
    method="POST"
>


<div class="password-group">

    <label for="current_password">

        Current Password

    </label>


    <input
        type="password"
        id="current_password"
        name="current_password"
        placeholder="Enter current password"
        required
    >

</div>


<div class="password-group">

    <label for="new_password">

        New Password

    </label>


    <input
        type="password"
        id="new_password"
        name="new_password"
        placeholder="Enter new password"
        minlength="6"
        required
    >

</div>


<div class="password-group">

    <label for="confirm_password">

        Confirm New Password

    </label>


    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        placeholder="Confirm new password"
        minlength="6"
        required
    >

</div>


<div class="password-buttons">

    <button
        type="submit"
        class="password-button"
    >

        <i class="fas fa-key"></i>

        Change Password

    </button>


    <a
        href="/profile"
        class="password-button cancel-password"
    >

        <i class="fas fa-arrow-left"></i>

        Cancel

    </a>

</div>


</form>

</div>

</section>


</body>

</html>
